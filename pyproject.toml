[project]
name = "dbxredact"
version = "0.3.1"
description = "PII/PHI detection and redaction library for Databricks"
readme = "README.md"
authors = [
    {name = "Eli Swanson", email = "eli.swanson@databricks.com"},
    {name = "Brennan Beal", email = "brennan.beal@databricks.com"},
    {name = "Yen Low", email = "yen.low@databricks.com"},
]
maintainers = [
    {name = "Eli Swanson", email = "eli.swanson@databricks.com"},
    {name = "Brennan Beal", email = "brennan.beal@databricks.com"},
    {name = "Yen Low", email = "yen.low@databricks.com"},
]
license = {text = "DB License"}
requires-python = ">=3.10.12,<3.13.0"
dependencies = [
    "presidio_analyzer==2.2.358",
    "presidio_anonymizer==2.2.358",
    "spacy==3.8.7",
    "rapidfuzz>=3.0.0",
    "pydantic>=2.0.0",
    "databricks-sdk>=0.30.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.0,<1.0.0"]
privacy_filter = ["opf @ git+https://github.com/openai/privacy-filter.git@f7f00ca7fb869683eb732c010299d901457f19c3"]
app = ["fastapi>=0.135.0", "starlette>=1.0.1", "uvicorn>=0.30.0"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "pandas>=2.0.0",
    "pyspark>=3.5.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/dbxredact"]

[tool.ruff]
# Keep the pinned rev in .pre-commit-config.yaml in sync with the ruff version
# the team runs. line-length is left at ruff's default (88).
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q"

[tool.coverage.run]
source = ["dbxredact"]

[tool.coverage.report]
fail_under = 40
show_missing = true
