name: CI

# Paused -- CI runners not available. Re-enable by uncommenting push/pull_request triggers.
# on:
#   push:
#     branches: [main, dev]
#   pull_request:
#     branches: [main, dev]
on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check src/ apps/dbxredact-app/
      - name: Ruff format check
        run: ruff format --check src/ apps/dbxredact-app/

  test-library:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run unit tests with coverage
        run: poetry run pytest tests/ -x -q --ignore=tests/integration --cov=dbxredact --cov-report=term-missing --cov-fail-under=40
      - name: Build wheel
        run: poetry build

  test-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install app dependencies
        run: |
          poetry install --with dev
          pip install -r apps/dbxredact-app/requirements.txt
      - name: Run app tests
        run: poetry run pytest apps/dbxredact-app/tests/ -x -q

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --with dev
      - name: Run integration tests
        run: poetry run pytest tests/integration/ -x -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & typecheck
        working-directory: apps/dbxredact-app
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit || true
      - name: Build
        working-directory: apps/dbxredact-app
        run: npm run build
