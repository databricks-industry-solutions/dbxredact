variables:
  # --- Used by databricks.yml.template ---
  current_user:
    description: "Current user for production run_as"
    default: ""
  current_working_directory:
    description: "Root path for production deployment"
    default: ""

  # --- Used by resources/jobs.yml and resources/app.yml ---
  catalog:
    description: "Unity Catalog name"
    default: ""
  schema:
    description: "Schema name"
    default: "redaction"
  max_rows:
    description: "Maximum rows to process in the redaction pipeline. Set to 0 for unlimited."
    default: "1000"
  detection_profile:
    description: "Detection profile: fast (AI+GLiNER+Presidio pattern-only), deep (all detectors), or custom"
    default: "fast"
  reasoning_effort:
    description: "AI Query reasoning effort level: low, medium, or high"
    default: "low"
  gliner_model:
    description: "GLiNER model: nvidia/gliner-PII (best accuracy, CC-BY-NC) or urchade/gliner_multi_pii-v1 (Apache 2.0)"
    default: "nvidia/gliner-PII"
  gliner_max_words:
    description: "GLiNER chunk size in words (256=fine-grained/high recall, 512=faster)"
    default: "256"
  language:
    description: "Source text language: en (English), es (Spanish). Non-English uses AI_QUERY only."
    default: "en"
  translate_to:
    description: "Translate redacted text to this language after redaction. 'none' to skip. Adds 3x AI_QUERY cost."
    default: "none"
  benchmark_dataset:
    description: "Base table name for benchmark data (source, ground truth, and intermediate tables are derived from this)"
    default: "jsl_benchmark"
  cpu_node_type:
    description: "Instance type for CPU clusters (AWS: i3.xlarge, Azure: Standard_DS3_v2)"
    default: "i3.xlarge"
  gpu_node_type:
    description: "Instance type for GPU clusters (AWS: g5.xlarge, Azure: Standard_NC4as_T4_v3)"
    default: "g5.xlarge"